# NOT included in kustomization.yaml. Create out-of-band (Sealed Secrets / External Secrets / Vault):
#   oc -n vector create secret generic vector-sink-credentials \
#     --from-literal=LOKI_URL=http://loki-gateway.logging.svc:80
apiVersion: v1
kind: Secret
metadata:
  name: vector-sink-credentials
  namespace: vector
type: Opaque
stringData:
  LOKI_URL: http://loki-gateway.logging.svc:80
  # LOKI_TOKEN: <bearer token, if using LokiStack gateway>
