apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-aggregator
  namespace: vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator
spec:
  serviceName: vector-aggregator-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
      app.kubernetes.io/component: aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: aggregator
    spec:
      serviceAccountName: vector-aggregator
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: aggregator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vector
          image: docker.io/timberio/vector:0.47.0-distroless-libc
          args: ["--config-dir", "/etc/vector/"]
          env:
            - name: VECTOR_LOG
              value: info
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: vector-sink-credentials
                  key: LOKI_URL
          ports:
            - { name: vector, containerPort: 6000, protocol: TCP }
            - { name: metrics, containerPort: 9598, protocol: TCP }
            - { name: api, containerPort: 8686, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          readinessProbe:
            httpGet: { path: /health, port: api }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: api }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: config, mountPath: /etc/vector, readOnly: true }
            - { name: data,   mountPath: /vector-data-dir }
      volumes:
        - name: config
          configMap:
            name: vector-aggregator-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: gp3-csi   # set to your block StorageClass
        resources:
          requests:
            storage: 20Gi
